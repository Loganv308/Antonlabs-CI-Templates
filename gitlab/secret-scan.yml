secret-scan:
  stage: .pre               # built-in stage, so it works even if a repo defines its own stages
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0            # full history
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks git --redact -v --exit-code 1 .